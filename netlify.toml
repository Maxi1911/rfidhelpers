[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/api/*"
  to = "https://api.linengrass.com/api/:splat"
  status = 200
  force = true
  headers = { Origin = "http://localhost:3000" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
